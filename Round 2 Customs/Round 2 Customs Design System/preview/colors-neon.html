<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{height:96px;border-radius:4px;border:1px solid rgba(255,255,255,.06)}
  .label{font-family:var(--font-display);text-transform:uppercase;font-size:10px;letter-spacing:.18em;color:#fff}
  .hex{font-family:var(--font-body);font-size:12px;color:var(--r2c-ash)}
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#D65E38;box-shadow:0 0 0 1px rgba(214,94,56,.55), 0 0 24px rgba(214,94,56,.45)"></div><div class="label">Orange</div><div class="hex">#D65E38 · primary</div></div>
  <div class="sw"><div class="chip" style="background:#59A9CC;box-shadow:0 0 0 1px rgba(89,169,204,.55), 0 0 24px rgba(89,169,204,.45)"></div><div class="label">Cyan</div><div class="hex">#59A9CC</div></div>
  <div class="sw"><div class="chip" style="background:#E7BE44;box-shadow:0 0 0 1px rgba(231,190,68,.55), 0 0 22px rgba(231,190,68,.4)"></div><div class="label">Yellow</div><div class="hex">#E7BE44</div></div>
  <div class="sw"><div class="chip" style="background:#59CC98;box-shadow:0 0 0 1px rgba(89,204,152,.55), 0 0 22px rgba(89,204,152,.4)"></div><div class="label">Green</div><div class="hex">#59CC98</div></div>
</div></body></html>
