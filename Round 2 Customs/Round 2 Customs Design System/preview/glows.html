<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .box{height:80px;background:#141416;border:1px solid #2A2A2E;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--r2c-ash);letter-spacing:.18em;text-transform:uppercase}
  .o{box-shadow:0 0 0 1px rgba(225,90,43,.55),0 0 24px rgba(225,90,43,.45)}
  .b{box-shadow:0 0 0 1px rgba(46,182,224,.55),0 0 24px rgba(46,182,224,.45)}
  .y{box-shadow:0 0 0 1px rgba(245,197,24,.55),0 0 22px rgba(245,197,24,.4)}
  .r{box-shadow:0 0 0 1px rgba(213,43,30,.55),0 0 22px rgba(213,43,30,.4)}
</style></head>
<body><div class="wrap">
  <div class="box o">orange</div>
  <div class="box b">cyan</div>
  <div class="box y">yellow</div>
  <div class="box r">red</div>
</div></body></html>
