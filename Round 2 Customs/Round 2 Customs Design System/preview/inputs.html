<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--r2c-ash);font-family:var(--font-display)}
  input,textarea{background:rgba(255,255,255,.04);border:1px solid #2A2A2E;border-radius:4px;color:#fff;padding:12px 14px;font-family:var(--font-body);font-size:14px;outline:0}
  input:focus{border-color:#E15A2B;box-shadow:0 0 0 3px rgba(225,90,43,.25)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="field"><label>Player Name</label><input value="Alen Parlov"></div>
    <div class="field"><label>Email</label><input value="alen@round2customs.com"></div>
  </div>
  <div class="field"><label>Project Brief</label><input placeholder="Tell us about your dream cabinet…"></div>
</div></body></html>
