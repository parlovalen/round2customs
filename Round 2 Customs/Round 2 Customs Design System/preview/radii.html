<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .box{height:96px;background:#1F1F22;border:1px solid #2A2A2E;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .lbl{font-size:11px;color:var(--r2c-ash);margin-top:8px;font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase}
</style></head>
<body><div class="wrap">
  <div><div class="box" style="border-radius:0">SHARP</div><div class="lbl">0 · sharp</div></div>
  <div><div class="box" style="border-radius:2px">SM</div><div class="lbl">2 · sm</div></div>
  <div><div class="box" style="border-radius:4px">MD</div><div class="lbl">4 · default</div></div>
  <div><div class="box" style="border-radius:8px">LG</div><div class="lbl">8 · lg</div></div>
</div></body></html>
