<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{height:84px;border-radius:4px;border:1px solid rgba(255,255,255,.08)}
  .label{font-family:var(--font-display);text-transform:uppercase;font-size:10px;letter-spacing:.16em;color:#fff}
  .hex{font-family:var(--font-body);font-size:11px;color:var(--r2c-ash)}
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#000000"></div><div class="label">Black</div><div class="hex">#000000</div></div>
  <div class="sw"><div class="chip" style="background:#0A0A0B"></div><div class="label">Ink</div><div class="hex">#0A0A0B</div></div>
  <div class="sw"><div class="chip" style="background:#0C0C0D"></div><div class="label">Pitch</div><div class="hex">#0C0C0D</div></div>
  <div class="sw"><div class="chip" style="background:#141416"></div><div class="label">Graphite</div><div class="hex">#141416</div></div>
  <div class="sw"><div class="chip" style="background:#1F1F22"></div><div class="label">Slate</div><div class="hex">#1F1F22</div></div>
  <div class="sw"><div class="chip" style="background:#2A2A2E"></div><div class="label">Line</div><div class="hex">#2A2A2E</div></div>
</div></body></html>
