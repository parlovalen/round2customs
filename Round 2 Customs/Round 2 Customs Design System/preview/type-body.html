<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">

  <div class="row"><div class="label">Pixel</div><div class="spec" style="font-family:var(--font-pixel);font-size:13px">alen@round2customs.com</div></div>
