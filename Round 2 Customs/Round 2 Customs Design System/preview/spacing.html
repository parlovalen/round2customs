<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sp{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .bar{background:#E15A2B}
  .lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.16em;color:var(--r2c-ash);text-transform:uppercase}
</style></head>
<body><div class="wrap">
  <div class="sp"><div class="bar" style="width:4px;height:18px"></div><div class="lbl">1 · 4</div></div>
  <div class="sp"><div class="bar" style="width:8px;height:18px"></div><div class="lbl">2 · 8</div></div>
  <div class="sp"><div class="bar" style="width:16px;height:18px"></div><div class="lbl">4 · 16</div></div>
  <div class="sp"><div class="bar" style="width:24px;height:18px"></div><div class="lbl">5 · 24</div></div>
  <div class="sp"><div class="bar" style="width:32px;height:18px"></div><div class="lbl">6 · 32</div></div>
  <div class="sp"><div class="bar" style="width:48px;height:18px"></div><div class="lbl">7 · 48</div></div>
</div></body></html>
