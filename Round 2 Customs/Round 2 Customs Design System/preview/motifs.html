<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:32px;display:flex;flex-direction:column;gap:22px}
  .stripe{display:flex;flex-direction:column;gap:4px}
  .stripe div{height:6px;border-radius:2px}
  .lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--r2c-ash)}
  .row{display:flex;gap:12px;align-items:center}
  .pix{display:inline-flex;gap:14px;align-items:center}
  .pix .h{color:#E7BE44;font-family:var(--font-pixel);font-size:14px}
  .pix .b{color:#59A9CC;font-family:var(--font-pixel);font-size:14px}
  .pix .o{color:#D65E38;font-family:var(--font-pixel);font-size:14px}
</style></head>
<body><div class="wrap">
  <div class="lbl">Rainbow Underline (section divider)</div>
  <div class="stripe" style="width:80%">
    <div style="background:#D65E38"></div>
    <div style="background:#E7BE44"></div>
    <div style="background:#59A9CC"></div>
  </div>
  <div class="lbl">Pixel iconography style</div>
  <div class="pix"><span class="o">▶</span><span class="h">☞</span><span class="b">◉</span><span style="font-family:var(--font-pixel);font-size:14px;color:#fff">1UP</span></div>
</div></body></html>
