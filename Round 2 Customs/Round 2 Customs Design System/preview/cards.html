<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:transparent;border:1px solid #2A2A2E;border-radius:0;padding:28px;display:flex;flex-direction:column;gap:14px}
  .eb{font-family:var(--font-display);font-size:10px;letter-spacing:.32em;color:#D65E38;text-transform:uppercase}
  .ti{font-family:var(--font-display);font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
  .bd{font-size:13px;color:var(--r2c-fog);line-height:1.6;margin-top:6px}
  .glow{box-shadow:0 0 0 1px rgba(214,94,56,.4),0 0 30px rgba(214,94,56,.2)}
</style></head>
<body><div class="wrap">
  <div class="card"><div class="eb">Insert Coin</div><div class="ti">The Origin Story</div><div class="bd">Founder Alen blends woodworking and electrical engineering — every machine built by hand.</div></div>
  <div class="card glow"><div class="eb">High Score</div><div class="ti">Hall of Fame</div><div class="bd">From private game rooms to corporate lounges — a portfolio of bespoke builds.</div></div>
</div></body></html>
