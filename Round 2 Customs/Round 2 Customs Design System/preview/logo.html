<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .card{padding:24px 28px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
  .pri,.alt{display:flex;align-items:center;justify-content:center;height:140px;border:1px solid #1F1F22;border-radius:4px;background:#000;padding:18px}
  .pri img{height:78px}
  .alt img{height:104px}
  .meta{grid-column:1 / -1;display:flex;flex-direction:column;gap:4px;color:var(--r2c-fog)}
  .name{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.18em;color:#fff;font-size:13px}
  .tag{font-size:12px;color:var(--r2c-ash)}
  .lbl{position:absolute;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.22em;font-size:9px;color:var(--r2c-ash);padding:6px 8px}
  .wrap{position:relative}
</style></head>
<body>
<div class="card">
  <div class="wrap"><div class="lbl">PRIMARY · HORIZONTAL</div><div class="pri"><img src="../assets/r2c-logo.svg" alt="R2C horizontal logo"></div></div>
  <div class="wrap"><div class="lbl">STACKED</div><div class="alt"><img src="../assets/r2c-logo-stacked.svg" alt="R2C stacked logo"></div></div>
  <div class="meta">
    <div class="name">Round 2 Customs — Wordmark Lockups</div>
    <div class="tag">Use on near-black backgrounds. Maintain padding ≥ 1× the height of the "R" stem on all sides. Stacked variant for square/social placements.</div>
  </div>
</div>
</body></html>
