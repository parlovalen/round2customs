<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{height:84px;border-radius:4px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:flex-end;padding:8px;font-family:var(--font-body);font-size:11px}
  .label{font-family:var(--font-display);text-transform:uppercase;font-size:10px;letter-spacing:.16em;color:#fff}
  .hex{font-family:var(--font-body);font-size:11px;color:var(--r2c-ash)}
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#FFFFFF;color:#000">Aa</div><div class="label">Bone</div><div class="hex">#FFFFFF · text</div></div>
  <div class="sw"><div class="chip" style="background:#E6E3D0;color:#000">Aa</div><div class="label">Parchment</div><div class="hex">#E6E3D0 · warm</div></div>
  <div class="sw"><div class="chip" style="background:#C9C9CE;color:#000">Aa</div><div class="label">Fog</div><div class="hex">#C9C9CE · 2°</div></div>
  <div class="sw"><div class="chip" style="background:#8A8A92;color:#000">Aa</div><div class="label">Ash</div><div class="hex">#8A8A92 · meta</div></div>
  <div class="sw"><div class="chip" style="background:#5A5A62;color:#fff">Aa</div><div class="label">Dim</div><div class="hex">#5A5A62 · disabled</div></div>
</div></body></html>
