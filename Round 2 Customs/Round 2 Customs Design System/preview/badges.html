<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body)}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:14px}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.2em;font-size:10px;border:1px solid}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .o{color:#E15A2B;border-color:#E15A2B}
  .b{color:#2EB6E0;border-color:#2EB6E0}
  .y{color:#F5C518;border-color:#F5C518}
  .g{color:#3DDC84;border-color:#3DDC84}
  .r{color:#D52B1E;border-color:#D52B1E}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
</style></head>
<body><div class="wrap">
  <div class="row">
    <span class="badge o"><span class="dot"></span>NEW BUILD</span>
    <span class="badge g"><span class="dot"></span>1UP · IN STOCK</span>
    <span class="badge y"><span class="dot"></span>LIMITED</span>
    <span class="badge b"><span class="dot"></span>CO-OP</span>
    <span class="badge r"><span class="dot"></span>GAME OVER</span>
  </div>
</div></body></html>
