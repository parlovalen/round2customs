<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Schedule — R2C</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      position: sticky;
      top: 52px;
      z-index: 40;
    }

    /* ── WEEK VIEW ── */
    .weeks-wrap {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .week-block {}

    .week-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .week-label {
      font-family: 'Michroma', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .week-divider {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .week-count {
      font-size: 11px;
      color: var(--text-3);
    }

    .week-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    /* ── CONTENT CARD ── */
    .content-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .content-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-1px);
    }
    .content-card.expanded {
      border-color: var(--red);
    }

    .content-card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .content-card-platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .platform-chip {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 0;
    }
    .plat-tiktok { background: rgba(255,0,80,0.15); color: #FF0050; }
    .plat-instagram { background: rgba(255,107,53,0.15); color: var(--orange); }
    .plat-facebook { background: var(--blue-bg); color: var(--blue); }

    .content-card-score {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .score-badge {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 0;
    }

    .content-card-expand {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease;
    }
    .content-card.expanded .content-card-expand { max-height: 300px; }

    .expand-divider { height: 1px; background: var(--border); margin: 10px 0; }

    .expand-row {
      margin-bottom: 8px;
    }
    .expand-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 3px;
    }
    .expand-val {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.5;
    }

    .status-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 0;
      letter-spacing: 0.04em;
    }
    .status-scheduled { background: var(--green-bg); color: var(--green); }
    .status-idea { background: var(--bg-elevated); color: var(--text-3); border: 1px solid var(--border-bright); }
    .status-posted { background: var(--blue-bg); color: var(--blue); }

    /* ── LIST VIEW ── */
    .list-view-card {
      display: grid;
      grid-template-columns: 36px 1fr 120px 80px 80px 100px;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .list-view-card:hover { border-color: var(--border-bright); }

    .list-rank {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
    }
    .list-rank.top { color: var(--red); }

    /* ── STATS STRIP ── */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .strip-cell {
      background: var(--bg-card);
      padding: 16px 20px;
    }
    .strip-cell-val {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .strip-cell-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="rail" id="rail"></aside>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Content Schedule <span>/ May 2026 · 2-Week Plan</span></span>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="pill-group" id="platformFilter">
        <button class="pill active" data-platform="all">All Platforms</button>
        <button class="pill" data-platform="TikTok">TikTok</button>
        <button class="pill" data-platform="Instagram">Instagram</button>
        <button class="pill" data-platform="Facebook">Facebook</button>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="btnWeek" onclick="setContentView('week')">
          <i data-lucide="layout-grid" style="font-size:12px;"></i> Calendar
        </button>
        <button class="btn btn-ghost btn-sm" id="btnList" onclick="setContentView('list')">
          <i data-lucide="list" style="font-size:12px;"></i> Ranked List
        </button>
      </div>
    </div>

    <div class="page-content" id="contentArea"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
let activePlatform = 'all';
let contentView = 'week';
let activeMonth = '2026-05';

function monthSubItems() {
  return REPORT_PERIODS.map(p => ({
    label: p.label,
    icon: 'calendar-days',
    active: p.id === activeMonth,
    onclick: p.hasData
      ? `selectMonth('${p.id}')`
      : `alert('No content plan for this period yet.')`
  }));
}

function selectMonth(id) {
  activeMonth = id;
  buildRail('content', monthSubItems());
  renderContentArea();
}

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const platChipClass = { TikTok: 'plat-tiktok', Instagram: 'plat-instagram', Facebook: 'plat-facebook' };

function filteredIdeas() {
  if (activePlatform === 'all') return CONTENT_IDEAS;
  return CONTENT_IDEAS.filter(i => i.platforms.includes(activePlatform));
}

function scoreStyle(s) {
  if (s >= 14) return 'background:var(--green-bg);color:var(--green);';
  if (s >= 12) return 'background:var(--yellow-bg);color:var(--yellow);';
  return 'background:var(--bg-elevated);color:var(--text-2);';
}

function makeContentCard(idea) {
  const plats = idea.platforms.map(p => `<span class="platform-chip ${platChipClass[p]||''}">${p}</span>`).join('');
  const statusCls = idea.status === 'scheduled' ? 'status-scheduled' : idea.status === 'posted' ? 'status-posted' : 'status-idea';
  const statusLabel = idea.status === 'scheduled' ? 'Scheduled' : idea.status === 'posted' ? 'Posted' : 'Idea';
  return `
    <div class="content-card" onclick="toggleCard(this)">
      <div class="content-card-platforms">${plats}</div>
      <div class="content-card-title">${idea.title}</div>
      <div class="content-card-score">
        <span class="score-badge" style="${scoreStyle(idea.score)}">${idea.score}/18</span>
        <span class="status-pill ${statusCls}">${statusLabel}</span>
      </div>
      <div class="content-card-expand">
        <div class="expand-divider"></div>
        <div class="expand-row">
          <div class="expand-label">Angle</div>
          <div class="expand-val">${idea.angle}</div>
        </div>
        <div class="expand-row">
          <div class="expand-label">Hook</div>
          <div class="expand-val">${idea.hook}</div>
        </div>
        <div class="expand-row">
          <div class="expand-label">Format</div>
          <div class="expand-val">${idea.format}</div>
        </div>
      </div>
    </div>
  `;
}

function toggleCard(el) {
  el.classList.toggle('expanded');
}

function renderWeekView() {
  const ideas = filteredIdeas();
  let html = '<div class="weeks-wrap">';

  for (let week = 1; week <= 2; week++) {
    const weekIdeas = ideas.filter(i => i.week === week);
    html += `
      <div class="week-block">
        <div class="week-header">
          <span class="week-label">Week ${week}</span>
          <span class="week-divider"></span>
          <span class="week-count">${weekIdeas.length} piece${weekIdeas.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="week-days">
    `;

    for (let day = 1; day <= 7; day++) {
      const dayIdeas = ideas.filter(i => i.week === week && i.day === day);
      html += `
        <div class="day-col">
          <div class="day-label">${DAYS[day-1]}</div>
          ${dayIdeas.map(i => makeContentCard(i)).join('') || '<div style="height:4px;"></div>'}
        </div>
      `;
    }
    html += '</div></div>';
  }

  html += '</div>';
  return html;
}

function renderListView() {
  const ideas = [...filteredIdeas()].sort((a, b) => b.score - a.score);
  const statsHtml = `
    <div class="stats-strip">
      <div class="strip-cell">
        <div class="strip-cell-val">${ideas.length}</div>
        <div class="strip-cell-lbl">Total Ideas</div>
      </div>
      <div class="strip-cell">
        <div class="strip-cell-val" style="color:var(--green);">${ideas.filter(i=>i.score>=14).length}</div>
        <div class="strip-cell-lbl">Score 14+</div>
      </div>
      <div class="strip-cell">
        <div class="strip-cell-val" style="color:var(--red);">${ideas.filter(i=>i.status==='scheduled').length}</div>
        <div class="strip-cell-lbl">Scheduled</div>
      </div>
      <div class="strip-cell">
        <div class="strip-cell-val">${Math.max(...ideas.map(i=>i.score))}</div>
        <div class="strip-cell-lbl">Top Score</div>
      </div>
    </div>
  `;

  const listHtml = `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${ideas.map((idea, idx) => {
        const plats = idea.platforms.map(p => `<span class="platform-chip ${platChipClass[p]||''}">${p}</span>`).join('');
        const statusCls = idea.status === 'scheduled' ? 'status-scheduled' : 'status-idea';
        const statusLabel = idea.status === 'scheduled' ? 'Scheduled' : 'Idea';
        return `
          <div class="list-view-card" onclick="this.classList.toggle('expanded')">
            <div class="list-rank${idx < 3 ? ' top' : ''}">${String(idx+1).padStart(2,'0')}</div>
            <div>
              <div style="font-size:13px;font-weight:600;margin-bottom:5px;">${idea.title}</div>
              <div style="font-size:11px;color:var(--text-3);">${idea.angle}</div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:3px;">${plats}</div>
            <div style="text-align:center;">
              <div style="font-family:'Space Mono',monospace;font-size:13px;font-weight:700;${idea.score>=14?'color:var(--green);':idea.score>=12?'color:var(--yellow);':''}">${idea.score}/18</div>
              <div style="font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;">Score</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:11px;font-weight:600;color:var(--text-2);">Wk ${idea.week} · D${idea.day}</div>
              <div style="font-size:9px;color:var(--text-3);">When</div>
            </div>
            <div><span class="status-pill ${statusCls}">${statusLabel}</span></div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  return statsHtml + listHtml;
}

function setContentView(v) {
  contentView = v;
  document.getElementById('btnWeek').classList.toggle('btn-primary', v === 'week');
  document.getElementById('btnWeek').classList.toggle('btn-ghost', v !== 'week');
  document.getElementById('btnList').classList.toggle('btn-primary', v === 'list');
  document.getElementById('btnList').classList.toggle('btn-ghost', v !== 'list');
  renderContentArea();
}

function renderContentArea() {
  const area = document.getElementById('contentArea');
  area.innerHTML = contentView === 'week' ? renderWeekView() : renderListView();
}

// Platform filter pills
document.getElementById('platformFilter').addEventListener('click', e => {
  const btn = e.target.closest('[data-platform]');
  if (!btn) return;
  activePlatform = btn.dataset.platform;
  document.querySelectorAll('#platformFilter .pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderContentArea();
});

buildRail('content', monthSubItems());
initIcons();
setContentView('week');
</script>
</body>
</html>
